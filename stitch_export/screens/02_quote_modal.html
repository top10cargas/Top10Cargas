<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGIX BRASIL - Tela 02: Modal de Cotação de Carga</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900/80 p-4 sm:p-8 flex items-center justify-center min-h-screen font-sans">
  
  <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col">
    <!-- Header -->
    <div class="p-5 bg-gradient-to-r from-sky-600 to-blue-700 text-white flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="p-2 bg-white/10 rounded-xl"><i data-lucide="package-plus" class="w-5 h-5"></i></div>
        <div>
          <h3 class="font-bold text-base">Solicitar Cotação de Frete Nacional</h3>
          <p class="text-xs text-sky-100">Transporte Rodoviário ou Aéreo por todo o Brasil</p>
        </div>
      </div>
      <button class="text-white/80 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>

    <!-- Form Body -->
    <div class="p-6 space-y-5 text-slate-700 text-xs">
      
      <!-- Modalidade -->
      <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
        <span class="font-bold text-slate-700 block mb-2 uppercase text-[10px] tracking-wider">Modalidade de Envio</span>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center gap-2 p-2.5 rounded-lg border border-sky-600 bg-sky-50/50 cursor-pointer">
            <input type="radio" name="modalidade" checked class="text-sky-600">
            <div>
              <span class="font-bold text-slate-900 flex items-center gap-1"><i data-lucide="truck" class="w-3.5 h-3.5 text-sky-600"></i> Rodoviário Nacional</span>
              <span class="text-[10px] text-slate-500">Carga fracionada ou direta</span>
            </div>
          </label>
          <label class="flex items-center gap-2 p-2.5 rounded-lg border border-slate-300 bg-white cursor-pointer hover:border-slate-400">
            <input type="radio" name="modalidade" class="text-sky-600">
            <div>
              <span class="font-bold text-slate-900 flex items-center gap-1"><i data-lucide="plane" class="w-3.5 h-3.5 text-emerald-600"></i> Frete Aéreo Express</span>
              <span class="text-[10px] text-slate-500">Aeroportos e capitais</span>
            </div>
          </label>
        </div>
      </div>

      <!-- Quantidade de Pacotes -->
      <div class="bg-sky-50/60 p-3 rounded-xl border border-sky-100 flex items-center justify-between">
        <label class="font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="boxes" class="w-4 h-4 text-sky-600"></i> Quantos volumes / pacotes você está enviando?
        </label>
        <div class="flex items-center gap-2">
          <input type="number" min="1" value="2" class="w-16 p-1.5 bg-white border border-sky-300 rounded text-center font-bold text-slate-900">
          <span class="font-semibold text-sky-800">volume(s)</span>
        </div>
      </div>

      <!-- Dimensões C x L x A -->
      <div>
        <label class="font-bold text-slate-900 block mb-1.5 flex items-center gap-2">
          <i data-lucide="ruler" class="w-4 h-4 text-sky-600"></i> Dimensões por volume em centímetros (cm)
        </label>
        <div class="grid grid-cols-3 gap-3">
          <div><span class="block text-slate-500 mb-1">Comprimento (cm)</span><input type="number" value="45" class="w-full p-2 border border-slate-300 rounded-lg"></div>
          <div><span class="block text-slate-500 mb-1">Largura (cm)</span><input type="number" value="35" class="w-full p-2 border border-slate-300 rounded-lg"></div>
          <div><span class="block text-slate-500 mb-1">Altura (cm)</span><input type="number" value="30" class="w-full p-2 border border-slate-300 rounded-lg"></div>
        </div>
        <p class="text-[11px] text-slate-500 mt-1 italic">Cubagem calculada: 47.250 cm³ (0,047 m³) • Peso cubado est.: 7,88 kg</p>
      </div>

      <!-- Peso Real e Valor Declarado -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="font-bold text-slate-900 block mb-1">Peso Total Real (kg)</label>
          <div class="relative">
            <input type="number" value="8.5" class="w-full pl-3 pr-10 py-2 border border-slate-300 rounded-lg font-bold">
            <span class="absolute right-3 top-2 text-slate-400 font-bold">KG</span>
          </div>
        </div>
        <div>
          <label class="font-bold text-slate-900 block mb-1">Valor da Nota Fiscal / Declarado (R$)</label>
          <div class="relative">
            <input type="number" value="4200" class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg font-bold">
            <span class="absolute left-3 top-2 text-slate-400 font-bold">R$</span>
          </div>
        </div>
      </div>

      <!-- Trajeto -->
      <div class="space-y-2">
        <div>
          <label class="font-bold text-slate-900 block mb-1 flex items-center gap-1.5"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-emerald-600"></i> Origem da Carga (Endereço, Cidade / UF e CEP)</label>
          <input type="text" value="Av. Paulista, 1578, Bela Vista - São Paulo / SP - CEP 01310-200" class="w-full p-2 border border-slate-300 rounded-lg">
        </div>
        <div>
          <label class="font-bold text-slate-900 block mb-1 flex items-center gap-1.5"><i data-lucide="navigation" class="w-3.5 h-3.5 text-sky-600"></i> Destino da Carga (Endereço, Cidade / UF e CEP)</label>
          <input type="text" value="Av. Djalma Batista, 1661, Chapada - Manaus / AM - CEP 69050-010" class="w-full p-2 border border-slate-300 rounded-lg">
        </div>
      </div>

      <!-- Botões -->
      <div class="pt-4 border-t border-slate-200 flex justify-end gap-3">
        <button class="px-4 py-2 font-semibold text-slate-600">Cancelar</button>
        <button class="px-6 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-bold uppercase tracking-wider rounded-xl shadow-lg flex items-center gap-2">
          <i data-lucide="send" class="w-4 h-4"></i> Enviar Solicitação
        </button>
      </div>

    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
